name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # WPF/WinForms need the Windows Desktop SDK, so this has to run on a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KeyboardSound.sln

      - name: Build
        run: dotnet build KeyboardSound.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/KeyboardSound.Tests/KeyboardSound.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
